app = "cozy-cinema-api" # troque pelo nome que o `fly launch` reservar
primary_region = "fra"  # Frankfurt — hub bem conectado na Europa; alternativas: "mad" (Madrid), "cdg" (Paris), "ams" (Amsterdã)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
